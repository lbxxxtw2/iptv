name: Generate playlist automatically

# Generate IPTV playlist every 6 hours (Beijing time: 04:17, 10:17, 16:17, 22:17)
# Commit only output/tv.txt back to the master branch. No Pages, Releases, or Artifacts.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20,2,8,14 * * *'

permissions:
  contents: write

concurrency:
  group: playlist-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Load upstream configuration
        if: github.repository_owner == 'Guovin'
        run: |
          git fetch --depth=1 origin gd
          git archive FETCH_HEAD config | tar -x

      - name: Set playlist output path to output/tv.txt
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re

          path = Path('config/user_config.ini')
          lines = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
          section_start = next(
              (i for i, line in enumerate(lines)
               if re.match(r'^\s*\[Settings\]\s*(?:[#;].*)?$', line, re.IGNORECASE)),
              None,
          )

          if section_start is None:
              lines = ['[Settings]', 'final_file = output/tv.txt', *lines]
          else:
              section_end = next(
                  (i for i in range(section_start + 1, len(lines))
                   if re.match(r'^\s*\[[^]]+\]', lines[i])),
                  len(lines),
              )
              setting_line = next(
                  (i for i in range(section_start + 1, section_end)
                   if re.match(r'^\s*final_file\s*=', lines[i], re.IGNORECASE)),
                  None,
              )
              if setting_line is None:
                  lines.insert(section_end, 'final_file = output/tv.txt')
              else:
                  lines[setting_line] = 'final_file = output/tv.txt'

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          print(f'Configured final_file=output/tv.txt in {path}')
          PYCODE

      - name: Record source revision and cache key
        id: source
        env:
          CONFIG_HASH: ${{ hashFiles('config/**/*.ini', 'config/**/*.txt', 'config/**/*.m3u') }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "state_prefix=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"
          echo "state_key=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/iptv-config-before"
          cp -a config/. "$RUNNER_TEMP/iptv-config-before/"

      - name: Clear previous generated output
        run: rm -rf -- output

      - name: Restore result history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}
          restore-keys: ${{ steps.source.outputs.state_prefix }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: pipenv

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --deploy

      - name: Generate playlist
        run: pipenv run dev

      - name: Verify generated TV playlist
        run: |
          test -s output/tv.txt
          echo "Generated output/tv.txt ($(wc -c < output/tv.txt) bytes)"
          {
            echo "## IPTV playlist generated"
            echo
            echo "- File: \`output/tv.txt\`"
            echo "- Raw URL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/output/tv.txt"
            echo "- Size: $(wc -c < output/tv.txt) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report non-persistent configuration changes
        run: |
          if ! diff -qr "$RUNNER_TEMP/iptv-config-before" config >/dev/null; then
            echo "::warning::The update changed files under config/. Only output/tv.txt will be committed."
            {
              echo "### Configuration notice"
              echo
              echo "The update changed files under \`config/\`. These changes are not committed."
              echo "Only \`output/tv.txt\` is persisted to the master branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save result history
        if: always() && (hashFiles('output/data/cache.gz') != '' || hashFiles('output/data/frozen.gz') != '')
        uses: actions/cache/save@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}

      - name: Commit updated tv.txt to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- output/tv.txt

          if git diff --cached --quiet; then
            echo "output/tv.txt has no changes; no commit is needed."
            exit 0
          fi

          git commit -m "Update IPTV playlist"
          git push origin HEAD:master

      - name: Show public subscription URL
        run: |
          echo "### Public IPTV subscription URL" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/output/tv.txt" >> "$GITHUB_STEP_SUMMARY"
